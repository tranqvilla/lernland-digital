<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjektive finden | Lernland</title>
  <style>
    :root {
      --ink: #24323d;
      --muted: #64727c;
      --paper: #fffdf8;
      --blue: #176b87;
      --blue-dark: #0e4c61;
      --yellow: #ffd166;
      --green: #237a57;
      --red: #b64d4d;
      --line: #dce5e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #e9f4f1, #fff7df);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 48px auto;
      padding: 40px;
      background: var(--paper);
      border: 1px solid rgba(23, 107, 135, 0.12);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(36, 50, 61, 0.12);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font: 700 0.8rem/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
    }

    .intro {
      margin: 18px 0 30px;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font: 700 0.85rem Arial, sans-serif;
    }

    .progress-bar {
      height: 8px;
      overflow: hidden;
      background: #e8eeee;
      border-radius: 10px;
    }

    .progress-bar span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--yellow);
      transition: width 250ms ease;
    }

    .word-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 28px 0;
    }

    .word {
      min-height: 62px;
      padding: 14px 18px;
      color: var(--ink);
      background: white;
      border: 2px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      font: 700 1.1rem Georgia, "Times New Roman", serif;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .word:hover { border-color: var(--blue); transform: translateY(-2px); }
    .word.selected { color: var(--blue-dark); background: #e5f4f2; border-color: var(--blue); }
    .word.correct { color: #14563d; background: #e3f5e8; border-color: var(--green); }
    .word.incorrect { color: #8a3333; background: #fbe8e5; border-color: var(--red); }
    .word:disabled { cursor: default; }
    .word:disabled:hover { transform: none; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    button.action {
      padding: 13px 20px;
      color: white;
      background: var(--blue);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: 700 1rem Arial, sans-serif;
    }

    button.action:hover { background: var(--blue-dark); }
    button.action:disabled { background: #a9b9bd; cursor: not-allowed; }

    #feedback {
      min-height: 1.5em;
      margin: 0;
      font: 700 1rem Arial, sans-serif;
    }

    #feedback.success { color: var(--green); }
    #feedback.error { color: var(--red); }

    @media (max-width: 520px) {
      main { margin: 20px auto; padding: 26px 20px; }
      .word-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Wortarten üben</p>
    <h1>Finde die Adjektive</h1>
    <p class="intro">Welche Wörter beschreiben, wie jemand oder etwas ist? Wähle alle Adjektive aus.</p>

    <div class="progress">
      <span id="round-label">Runde 1 von 1</span>
      <span id="score-label">0 von 10 richtig</span>
    </div>
    <div class="progress-bar" aria-hidden="true"><span id="progress-fill"></span></div>

    <section aria-labelledby="word-heading">
      <h2 id="word-heading" hidden>Wörter auswählen</h2>
      <div class="word-list" id="word-list"></div>
    </section>

    <div class="actions">
      <button class="action" id="check-button" type="button" disabled>Auswahl prüfen</button>
      <button class="action" id="restart-button" type="button" hidden>Nochmal spielen</button>
      <p id="feedback" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script>
    const words = [
      { text: "fröhlich", adjective: true },
      { text: "laufen", adjective: false },
      { text: "klein", adjective: true },
      { text: "Schule", adjective: false },
      { text: "glänzend", adjective: true },
      { text: "springen", adjective: false },
      { text: "mutig", adjective: true },
      { text: "Freund", adjective: false },
      { text: "leise", adjective: true },
      { text: "lesen", adjective: false }
    ];

    const wordList = document.querySelector("#word-list");
    const checkButton = document.querySelector("#check-button");
    const restartButton = document.querySelector("#restart-button");
    const feedback = document.querySelector("#feedback");
    const scoreLabel = document.querySelector("#score-label");
    const progressFill = document.querySelector("#progress-fill");
    let selectedWords = new Set();
    let roundWords = [];

    function shuffleWords() {
      roundWords = [...words];
      for (let index = roundWords.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [roundWords[index], roundWords[randomIndex]] = [roundWords[randomIndex], roundWords[index]];
      }
    }

    function renderWords() {
      wordList.innerHTML = "";
      roundWords.forEach((word, index) => {
        const button = document.createElement("button");
        button.className = "word";
        button.type = "button";
        button.textContent = word.text;
        button.dataset.index = index;
        button.addEventListener("click", () => {
          selectedWords.has(index) ? selectedWords.delete(index) : selectedWords.add(index);
          button.classList.toggle("selected", selectedWords.has(index));
          checkButton.disabled = selectedWords.size === 0;
          feedback.textContent = "";
          feedback.className = "";
        });
        wordList.appendChild(button);
      });
    }

    function checkAnswers() {
      const buttons = [...wordList.children];
      let correct = 0;
      roundWords.forEach((word, index) => {
        const isSelected = selectedWords.has(index);
        const isCorrect = isSelected === word.adjective;
        buttons[index].disabled = true;
        buttons[index].classList.remove("selected");
        buttons[index].classList.add(isCorrect ? "correct" : "incorrect");
        if (isCorrect) correct++;
      });
      scoreLabel.textContent = `${correct} von ${words.length} richtig`;
      progressFill.style.width = `${correct / words.length * 100}%`;
      feedback.textContent = correct === words.length
        ? "Alles richtig! Stark gemacht."
        : `Du hast ${correct} von ${words.length} Wörtern richtig eingeordnet.`;
      feedback.className = correct === words.length ? "success" : "error";
      checkButton.hidden = true;
      restartButton.hidden = false;
    }

    function restart() {
      selectedWords = new Set();
      shuffleWords();
      checkButton.hidden = false;
      checkButton.disabled = true;
      restartButton.hidden = true;
      scoreLabel.textContent = "0 von 10 richtig";
      progressFill.style.width = "0";
      feedback.textContent = "";
      feedback.className = "";
      renderWords();
    }

    checkButton.addEventListener("click", checkAnswers);
    restartButton.addEventListener("click", restart);
    shuffleWords();
    renderWords();
  </script>
</body>
</html>
